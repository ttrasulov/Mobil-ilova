<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android & Kotlin Quiz — 100 soraw</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: .95rem; }

  /* Прогресс */
  .progress-bar {
    height: 8px;
    background: #334155;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .3s ease;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    color: var(--muted);
    margin-bottom: 24px;
  }

  /* Вопрос */
  .question {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* Ответы */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    padding: 14px 18px;
    background: #334155;
    border: 2px solid transparent;
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .option:hover:not(:disabled) {
    background: #475569;
    border-color: var(--accent);
  }
  .option:disabled { cursor: default; }
  .option.correct { background: var(--correct); color: #052e16; font-weight: 600; }
  .option.wrong   { background: var(--wrong);   color: #450a0a; font-weight: 600; }

  /* Экран результатов */
  .result { text-align: center; padding: 20px 0; }
  .result .score-big {
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--accent);
    margin: 16px 0;
  }
  .result .message { font-size: 1.1rem; margin-bottom: 24px; color: var(--muted); }

  .btn {
    padding: 14px 32px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: #2563eb; }

  .hidden { display: none; }

  /* Таймер */
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .timer.danger { color: var(--wrong); }
</style>
</head>
<body>
<div class="container">

  <!-- Стартовый экран -->
  <div id="startScreen">
    <h1>📱 Android & Kotlin Quiz</h1>
    <p class="subtitle">100 soraw · hár sorawǵa 20 sekund · nátiyjení biliń</p>
    <button class="btn" onclick="startQuiz()">Baslaw 🚀</button>
  </div>

  <!-- Экран викторины -->
  <div id="quizScreen" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="meta">
      <span>Soraw <b id="qNum">1</b> / <b id="qTotal">100</b></span>
      <span class="timer" id="timer">⏱ 20s</span>
      <span>Ball: <b id="scoreNow">0</b></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
  </div>

  <!-- Экран результатов -->
  <div id="resultScreen" class="hidden result">
    <h1>Nátiyje 🎉</h1>
    <div class="score-big" id="finalScore">0</div>
    <div class="message" id="finalMessage"></div>
    <button class="btn" onclick="location.reload()">Qaytadan 🔄</button>
  </div>

</div>

/* ============================================================
   ЛОГИКА ВИКТОРИНЫ
   ============================================================ */
const TIME_PER_QUESTION = 20; // секунд на вопрос

let questions = [];
let current = 0;
let score = 0;
let timerId = null;
let timeLeft = TIME_PER_QUESTION;
let locked = false;

// Перемешивание массива (Fisher–Yates)
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  // Перемешиваем вопросы и варианты ответов
  questions = shuffle(QUESTIONS).map(q => {
    const correctText = q.o[q.a];
    const opts = shuffle(q.o);
    return { q: q.q, o: opts, a: opts.indexOf(correctText) };
  });
  current = 0;
  score = 0;

  document.getElementById("qTotal").textContent = questions.length;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  locked = false;
  const q = questions[current];

  // Обновляем прогресс и счёт
  document.getElementById("qNum").textContent = current + 1;
  document.getElementById("scoreNow").textContent = score;
  document.getElementById("progressFill").style.width =
    ((current) / questions.length * 100) + "%";

  // Текст вопроса
  document.getElementById("questionText").textContent = q.q;

  // Варианты
  const box = document.getElementById("optionsBox");
  box.innerHTML = "";
  q.o.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(idx, btn);
    box.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerId);
  timeLeft = TIME_PER_QUESTION;
  const timerEl = document.getElementById("timer");
  timerEl.classList.remove("danger");
  timerEl.textContent = `⏱ ${timeLeft}s`;

  timerId = setInterval(() => {
    timeLeft--;
    timerEl.textContent = `⏱ ${timeLeft}s`;
    if (timeLeft <= 5) timerEl.classList.add("danger");
    if (timeLeft <= 0) {
      clearInterval(timerId);
      timeUp();
    }
  }, 1000);
}

function timeUp() {
  if (locked) return;
  locked = true;
  // Подсветить правильный ответ
  const q = questions[current];
  const btns = document.querySelectorAll(".option");
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add("correct");
  });
  setTimeout(nextQuestion, 1200);
}

function selectAnswer(idx, btn) {
  if (locked) return;
  locked = true;
  clearInterval(timerId);

  const q = questions[current];
  const btns = document.querySelectorAll(".option");
  btns.forEach(b => b.disabled = true);

  if (idx === q.a) {
    btn.classList.add("correct");
    score++;
    document.getElementById("scoreNow").textContent = score;
  } else {
    btn.classList.add("wrong");
    btns[q.a].classList.add("correct");
  }

  setTimeout(nextQuestion, 1000);
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  clearInterval(timerId);
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  const total = questions.length;
  const percent = Math.round(score / total * 100);
  document.getElementById("finalScore").textContent = `${score} / ${total}`;

  let msg = "";
  if (percent >= 90) msg = "🏆 Ájayıp! Siz Android/Kotlin boyınsha ekspertsiz!";
  else if (percent >= 70) msg = "🎉 Jaqsı nátiyje! Biraz shınıǵıw menen 100% boladı.";
  else if (percent >= 50) msg = "👍 Orta nátiyje. Materialdı qayta kórip shıǵıń.";
  else msg = "📚 Basıw. Eske túsiriw kerek — qaytadan urınıp kóriń!";

  document.getElementById("finalMessage").textContent =
    `${percent}% — ${msg}`;
}
</script>
